<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>A Little Question for You ❤️</title>

  <!-- SVG Heart Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💖</text></svg>" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Dancing+Script:wght@600;700&family=Yatra+One&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet" />

  <style>
    /* ===================================================
       RESET & THEME
       =================================================== */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg-gradient: linear-gradient(135deg, #ffe5ec 0%, #fcd5ce 25%, #f8edeb 50%, #e8d7f1 75%, #d8bbff 100%);
      --primary-pink: #ff4d6d;
      --deep-pink: #d90429;
      --soft-pink: #ffb3c6;
      --card-bg: rgba(255, 255, 255, 0.9);
      --glass-border: rgba(255, 255, 255, 0.95);
      --shadow-soft: 0 14px 40px rgba(255, 77, 109, 0.22);
      --font-cursive: 'Dancing Script', cursive;
      --font-body: 'Quicksand', sans-serif;
      --font-hindi: 'Yatra One', cursive, sans-serif;
      --text-dark: #3a1d28;
    }

    body {
      font-family: var(--font-body);
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg-gradient);
      background-size: 300% 300%;
      animation: gradientShift 14s ease infinite;
      color: var(--text-dark);
      overflow-x: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    #ambientCanvas, #confettiCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    #ambientCanvas { z-index: 1; }
    #confettiCanvas { z-index: 90; }

    /* ===================================================
       MUSIC PLAYER
       =================================================== */
    .music-widget {
      position: fixed;
      top: 0.8rem;
      right: 0.8rem;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .music-toggle-btn {
      background: rgba(255, 255, 255, 0.95);
      border: 2px solid var(--soft-pink);
      color: var(--deep-pink);
      border-radius: 50px;
      padding: 0.5rem 0.9rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.85rem;
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
    }

    .music-disc {
      display: inline-block;
      animation: spin 3s linear infinite paused;
    }

    .music-playing .music-disc {
      animation-play-state: running;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    .music-dropdown {
      position: absolute;
      top: 110%;
      right: 0;
      width: 250px;
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid var(--glass-border);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
      border-radius: 16px;
      padding: 0.85rem;
      backdrop-filter: blur(15px);
      display: none;
      flex-direction: column;
      gap: 0.6rem;
    }

    .music-dropdown.active {
      display: flex;
    }

    .track-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--deep-pink);
      text-align: center;
    }

    .audio-controls-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.8rem;
    }

    .ctrl-icon-btn {
      background: #ffe3ec;
      border: none;
      color: var(--primary-pink);
      border-radius: 50%;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.95rem;
    }

    .music-slider {
      -webkit-appearance: none;
      width: 100%;
      height: 5px;
      border-radius: 5px;
      background: #ffd3e0;
      outline: none;
    }

    .music-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--primary-pink);
      cursor: pointer;
    }

    .time-info {
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      color: #7d5a6a;
      font-weight: 600;
    }

    /* Floating tap tip */
    .tap-music-tip {
      position: fixed;
      top: 3.8rem;
      right: 0.8rem;
      background: rgba(255, 255, 255, 0.92);
      border: 1.5px solid var(--soft-pink);
      color: var(--deep-pink);
      font-size: 0.76rem;
      font-weight: 700;
      padding: 0.35rem 0.75rem;
      border-radius: 20px;
      z-index: 99;
      box-shadow: 0 4px 15px rgba(255, 77, 109, 0.2);
      animation: pulseTip 1.5s infinite;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }

    @keyframes pulseTip {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.05); opacity: 1; }
    }

    .tap-music-tip.hide {
      opacity: 0;
      visibility: hidden;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(255, 255, 255, 0.96);
      color: var(--text-dark);
      border-left: 5px solid var(--primary-pink);
      padding: 0.75rem 1.25rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      font-size: 0.85rem;
      font-weight: 600;
      z-index: 200;
      opacity: 0;
      transition: all 0.4s ease;
      max-width: 90%;
      text-align: center;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* ===================================================
       CONTAINER & SCREENS
       =================================================== */
    .container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 480px;
      margin: auto;
      text-align: center;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 2px solid var(--glass-border);
      border-radius: 28px;
      padding: 2rem 1.4rem;
      box-shadow: var(--shadow-soft);
    }

    .screen.hidden {
      display: none;
      opacity: 0;
    }

    /* Mascot Teddy */
    .cute-bear-box {
      width: 130px;
      height: 130px;
      margin: 0 auto 1rem;
    }

    .bear-svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 6px 12px rgba(255, 77, 109, 0.25));
      animation: floatTeddy 3s ease-in-out infinite;
    }

    @keyframes floatTeddy {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }

    .main-heading {
      font-family: var(--font-cursive);
      font-size: clamp(2.3rem, 8vw, 3.1rem);
      color: var(--deep-pink);
    }

    .sub-heading {
      font-size: clamp(1.2rem, 5vw, 1.55rem);
      font-weight: 700;
      color: #63324d;
      margin-top: 0.3rem;
    }

    .playful-message {
      min-height: 2.6rem;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--deep-pink);
      margin: 0.6rem 0 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .buttons-arena {
      position: relative;
      width: 100%;
      min-height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.2rem;
      flex-wrap: wrap;
    }

    .btn {
      border: none;
      cursor: pointer;
      font-weight: 700;
      font-size: 1.1rem;
      padding: 0.85rem 2.2rem;
      border-radius: 50px;
      transition: transform 0.25s ease, box-shadow 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn:active { transform: scale(0.95); }

    .btn-yes {
      background: linear-gradient(135deg, #ff4d6d, #ff758f);
      color: #fff;
      box-shadow: 0 8px 25px rgba(255, 77, 109, 0.45);
      z-index: 5;
    }

    .btn-no {
      background: #ffffff;
      color: #6a4c58;
      border: 2px solid #fbc4d4;
      z-index: 4;
      white-space: nowrap;
    }

    /* ===================================================
       CELEBRATION SCREEN
       =================================================== */
    .celebration-title {
      font-family: var(--font-cursive);
      font-size: clamp(2.2rem, 7vw, 2.9rem);
      color: var(--deep-pink);
      margin-bottom: 0.2rem;
    }

    .love-decor-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.2rem;
      margin: 0.8rem 0 1rem;
    }

    .rose-decor {
      font-size: 1.9rem;
      display: inline-block;
      animation: roseSway 2.5s ease-in-out infinite alternate;
      transform-origin: bottom center;
    }

    .rose-right {
      animation-delay: 1.2s;
    }

    @keyframes roseSway {
      0% { transform: rotate(-10deg) scale(0.95); }
      100% { transform: rotate(14deg) scale(1.08); }
    }

    .dhak-dhak-heart {
      font-size: 2.3rem;
      display: inline-block;
      animation: dhakDhak 0.85s ease-in-out infinite;
      filter: drop-shadow(0 0 10px rgba(255, 0, 70, 0.4));
    }

    @keyframes dhakDhak {
      0% { transform: scale(1); }
      15% { transform: scale(1.28); }
      30% { transform: scale(1.05); }
      45% { transform: scale(1.24); }
      60% { transform: scale(1); }
      100% { transform: scale(1); }
    }

    .envelope-wrapper {
      position: relative;
      width: 100%;
      max-width: 340px;
      margin: 0.5rem auto 1.5rem;
    }

    .envelope {
      position: relative;
      width: 100%;
      background: #ff5c8a;
      border-radius: 18px;
      padding: 1.2rem 0.9rem;
      box-shadow: 0 15px 35px rgba(217, 4, 41, 0.22);
    }

    .letter-paper {
      background: #fffdf7;
      border-radius: 14px;
      padding: 1.4rem 1.1rem;
      box-shadow: inset 0 0 12px rgba(255, 179, 198, 0.3), 0 5px 15px rgba(0,0,0,0.06);
      border: 1px solid #ffd6e0;
      text-align: left;
    }

    .letter-paper h3 {
      font-family: var(--font-cursive);
      font-size: 1.85rem;
      color: var(--deep-pink);
      text-align: center;
      margin-bottom: 0.9rem;
    }

    .lyric-line {
      font-family: var(--font-hindi);
      font-size: 1.02rem;
      line-height: 1.9;
      color: #50313f;
      margin-bottom: 0.85rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.3rem;
    }

    .lyric-word {
      position: relative;
      display: inline-block;
      padding-bottom: 2px;
      transition: color 0.2s ease, transform 0.2s ease;
    }

    .lyric-word::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: 0;
      width: 0%;
      height: 2.8px;
      background: var(--deep-pink);
      border-radius: 2px;
      transition: width 0.25s ease;
    }

    .lyric-word.active {
      color: var(--deep-pink);
      font-weight: 700;
      transform: translateY(-1.5px);
    }

    .lyric-word.active::after,
    .lyric-word.passed::after {
      width: 100%;
    }

    .line-emoji {
      font-size: 1.2rem;
      margin-left: 0.2rem;
      display: inline-block;
      animation: miniBounce 1.5s ease-in-out infinite;
    }

    @keyframes miniBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }

    .letter-sign {
      font-family: var(--font-cursive);
      font-size: 1.35rem;
      color: var(--deep-pink);
      text-align: right;
      margin-top: 1rem;
    }

    .celebration-actions {
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
      align-items: center;
    }

    .secondary-btn {
      background: rgba(255, 255, 255, 0.95);
      border: 2px solid var(--soft-pink);
      color: var(--deep-pink);
      font-weight: 700;
      padding: 0.75rem 1.6rem;
      border-radius: 50px;
      cursor: pointer;
      font-family: var(--font-body);
      font-size: 0.95rem;
      box-shadow: var(--shadow-soft);
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.3s ease;
    }

    .secondary-btn:hover {
      background: #fff;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <canvas id="ambientCanvas"></canvas>
  <canvas id="confettiCanvas"></canvas>

  <!-- ===================================================
       AUDIO PLAYER (assets/my-love-song.mp3)
       =================================================== -->
  <audio id="loveAudio" preload="auto">
    <source src="assets/my-love-song.mp3" type="audio/mpeg" />
    <source src="assets/my-love-song.ogg" type="audio/ogg" />
    <source src="assets/my-love-song.wav" type="audio/wav" />
  </audio>

  <div class="music-widget">
    <button class="music-toggle-btn" id="musicToggleBtn" aria-label="Toggle song controls">
      <span class="music-disc">🎵</span>
      <span id="musicBtnLabel">Our Song</span>
    </button>

    <div class="music-dropdown" id="musicDropdown">
      <div class="track-title">Aaj Se Teri 💖</div>
      
      <div class="audio-controls-row">
        <button class="ctrl-icon-btn" id="playPauseBtn" aria-label="Play or Pause">▶</button>
        <button class="ctrl-icon-btn" id="muteBtn" aria-label="Mute">🔊</button>
      </div>

      <div>
        <input type="range" class="music-slider" id="progressSlider" value="0" min="0" max="100" step="0.1" />
        <div class="time-info">
          <span id="currentTime">0:18</span>
          <span id="totalDuration">5:12</span>
        </div>
      </div>

      <div style="display:flex; align-items:center; gap:0.5rem; font-size:0.8rem;">
        <span>🔉</span>
        <input type="range" class="music-slider" id="volumeSlider" value="85" min="0" max="100" />
      </div>
    </div>
  </div>

  <div class="tap-music-tip" id="tapMusicTip">🎵 Tap anywhere to play</div>
  <div class="toast" id="userToast"></div>

  <!-- ===================================================
       MAIN PROPOSAL SCREEN
       =================================================== -->
  <main class="container">
    <div class="card">

      <section class="screen" id="proposalScreen">
        <div class="cute-bear-box" aria-hidden="true">

            <circle cx="40" cy="106" r="4" fill="#fbb1bd"/>

            <circle cx="73" cy="81" r="6" fill="#bb855a"/>
          </svg>
        </div>

        <div>
          <h1 class="main-heading">I Love You ❤️</h1>
          <h2 class="sub-heading">Will You Be My Girlfriend? 💖</h2>
        </div>

        <p class="playful-message" id="playfulMessage" aria-live="polite"></p>

        <div class="buttons-arena" id="buttonArea">

          <button class="btn btn-no" id="btnNo">NO 🙈</button>

      </section>

      <!-- CELEBRATION & SYNCED LYRICS SCREEN -->

        <div class="love-decor-bar">

        <div class="envelope-wrapper">

              <div class="lyric-line" id="line2">
                <span class="lyric-word" data-start="7.8" data-end="8.4">तेरी</span>
                <span class="lyric-word" data-start="8.5" data-end="9.2">बाली</span>

                <span class="lyric-word" data-start="10.9" data-end="11.2">को,</span>
                <span class="lyric-word" data-start="11.3" data-end="11.6">मैं</span>
                <span class="lyric-word" data-start="11.7" data-end="12.0">दिल</span>
                <span class="lyric-word" data-start="12.1" data-end="12.4">से</span>
                <span class="lyric-word" data-start="12.5" data-end="13.0">लगाके</span>
                <span class="lyric-word" data-start="13.1" data-end="14.0">झूमूँगा</span>
                <span class="line-emoji">💃💍</span>
              </div>

              <div class="lyric-line" id="line3">
                <span class="lyric-word" data-start="14.2" data-end="14.9">मेरी</span>
                <span class="lyric-word" data-start="15.0" data-end="15.8">छोटी</span>
                <span class="lyric-word" data-start="15.9" data-end="16.2">सी</span>
                <span class="lyric-word" data-start="16.3" data-end="17.2">भूलों</span>
                <span
